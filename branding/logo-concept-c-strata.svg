<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SMM UP — Concept C: Strata Tower</title>

  <!-- Obsidian Architectural Slab -->
  <rect width="128" height="128" rx="22" fill="#090807"/>

  <defs>
    <filter id="cGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cChampagne" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blueprint Strata Lines (architectural tiers) -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="14" y1="31" x2="38" y2="31" stroke-opacity="0.16" stroke-width="1.4"/>
    <line x1="90" y1="31" x2="114" y2="31" stroke-opacity="0.16" stroke-width="1.4"/>
    <line x1="14" y1="51" x2="20" y2="51" stroke-opacity="0.16" stroke-width="1.4"/>
    <line x1="108" y1="51" x2="114" y2="51" stroke-opacity="0.16" stroke-width="1.4"/>
    <line x1="14" y1="71" x2="22" y2="71" stroke-opacity="0.16" stroke-width="1.4"/>
    <line x1="106" y1="71" x2="114" y2="71" stroke-opacity="0.16" stroke-width="1.4"/>
  </g>

  <!-- Champagne Apex Chevron breaking the skyline -->
  <path d="M 64 13 L 75 27 L 69 27 L 69 31 L 59 31 L 59 27 L 53 27 Z" fill="#F5E8D0" filter="url(#cChampagne)"/>

  <!-- 'UP' as a standing tower monogram -->
  <g fill="#FAF7F2" filter="url(#cGlow)">
    <path d="M 31 34 L 43 34 L 43 64 C 43 68 46 71 50 71 C 54 71 57 68 57 64 L 57 34 L 69 34 L 69 65 C 69 77 61 84 50 84 C 39 84 31 77 31 65 Z"/>
    <path d="M 78 34 L 96 34 C 104 34 110 39 110 47 C 110 55 104 60 96 60 L 88 60 L 88 84 L 78 84 Z M 88 44 L 88 50 L 95 50 C 97.5 50 99.5 49 99.5 47 C 99.5 45 97.5 44 95 44 Z"/>
  </g>

  <!-- Tower Core Node -->
  <circle cx="88" cy="47" r="2.4" fill="#090807"/>

  <!-- Foundation slab + double ground line -->
  <line x1="20" y1="97" x2="108" y2="97" stroke="#FAF7F2" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
  <line x1="34" y1="105" x2="94" y2="105" stroke="#F5E8D0" stroke-width="1.8" opacity="0.55" stroke-linecap="round"/>
  <line x1="50" y1="112" x2="78" y2="112" stroke="#FFFFFF" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
</svg>

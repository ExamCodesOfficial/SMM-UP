<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SMM UP — Concept B: Orbital Node</title>

  <!-- Deep Obsidian Coin Canvas -->
  <rect width="128" height="128" rx="24" fill="#090807"/>

  <!-- Fine Architectural Corner Ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="26" x2="16" y2="16"/>
    <line x1="16" y1="16" x2="26" y2="16"/>
    <line x1="112" y1="26" x2="112" y2="16"/>
    <line x1="112" y1="16" x2="102" y2="16"/>
    <line x1="16" y1="102" x2="16" y2="112"/>
    <line x1="16" y1="112" x2="26" y2="112"/>
    <line x1="112" y1="102" x2="112" y2="112"/>
    <line x1="112" y1="112" x2="102" y2="112"/>
  </g>

  <defs>
    <filter id="bGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bCore" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1A1713"/>
      <stop offset="100%" stop-color="#090807"/>
    </radialGradient>
  </defs>

  <!-- Champagne Orbital Ring (tilted ellipse) -->
  <ellipse cx="64" cy="64" rx="44" ry="30" fill="none" stroke="#F5E8D0" stroke-opacity="0.85" stroke-width="1.6"
           transform="rotate(-22 64 64)"/>
  <ellipse cx="64" cy="64" rx="44" ry="30" fill="none" stroke="#F5E8D0" stroke-opacity="0.22" stroke-width="4.5"
           transform="rotate(-22 64 64)"/>

  <!-- Deep Core Chamber -->
  <circle cx="64" cy="64" r="29" fill="url(#bCore)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- 'UP' Monogram compressed into the core -->
  <g transform="translate(40.5 48) scale(0.44)" fill="#FAF7F2">
    <path d="M 28 36 L 40 36 L 40 64 C 40 68 43 71 47 71 C 51 71 54 68 54 64 L 54 36 L 66 36 L 66 65 C 66 76 58 83 47 83 C 36 83 28 76 28 65 Z"/>
    <path d="M 74 36 L 94 36 C 103 36 109 41 109 49 C 109 57 103 62 94 62 L 86 62 L 86 83 L 74 83 Z M 86 46 L 86 52 L 93 52 C 96 52 98 51 98 49 C 98 47 96 46 93 46 Z"/>
  </g>

  <!-- Glowing Satellite Node riding the orbit -->
  <circle cx="103.5" cy="47.5" r="10" fill="#F5E8D0" opacity="0.14"/>
  <circle cx="103.5" cy="47.5" r="4" fill="#F5E8D0" filter="url(#bGlow)"/>

  <!-- Small counter node -->
  <circle cx="24.5" cy="80.5" r="2.2" fill="#FFFFFF" opacity="0.75"/>

  <!-- Micro telemetry strokes at base -->
  <line x1="44" y1="106" x2="84" y2="106" stroke="#F5E8D0" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
</svg>

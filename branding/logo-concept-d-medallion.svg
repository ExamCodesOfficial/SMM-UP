<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SMM UP — Concept D: Telemetry Medallion</title>

  <!-- Obsidian Canvas -->
  <rect width="128" height="128" rx="24" fill="#090807"/>

  <defs>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dChampagne" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dFace" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#14120F"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
  </defs>

  <!-- Medallion Face -->
  <circle cx="64" cy="64" r="46" fill="url(#dFace)" stroke="#F5E8D0" stroke-opacity="0.5" stroke-width="1.6"/>

  <!-- Telemetry Dial Ticks (24 micro-marks around the ring) -->
  <g stroke="#F5E8D0" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="20" x2="64" y2="25"/>
    <line x1="86" y1="25.9" x2="83.5" y2="30.2"/>
    <line x1="102.1" y1="42" x2="97.8" y2="44.5"/>
    <line x1="108" y1="64" x2="103" y2="64"/>
    <line x1="102.1" y1="86" x2="97.8" y2="83.5"/>
    <line x1="86" y1="102.1" x2="83.5" y2="97.8"/>
    <line x1="64" y1="108" x2="64" y2="103"/>
    <line x1="42" y1="102.1" x2="44.5" y2="97.8"/>
    <line x1="25.9" y1="86" x2="30.2" y2="83.5"/>
    <line x1="20" y1="64" x2="25" y2="64"/>
    <line x1="25.9" y1="42" x2="30.2" y2="44.5"/>
    <line x1="42" y1="25.9" x2="44.5" y2="30.2"/>
  </g>

  <!-- Champagne Apex Node at 12 o'clock -->
  <circle cx="64" cy="21.5" r="3.2" fill="#F5E8D0" filter="url(#dChampagne)"/>

  <!-- 'UP' Monogram centered on the face -->
  <g transform="translate(30 33.5) scale(0.52)" fill="#FAF7F2" filter="url(#dGlow)">
    <path d="M 28 36 L 40 36 L 40 64 C 40 68 43 71 47 71 C 51 71 54 68 54 64 L 54 36 L 66 36 L 66 65 C 66 76 58 83 47 83 C 36 83 28 76 28 65 Z"/>
    <path d="M 74 36 L 94 36 C 103 36 109 41 109 49 C 109 57 103 62 94 62 L 86 62 L 86 83 L 74 83 Z M 86 46 L 86 52 L 93 52 C 96 52 98 51 98 49 C 98 47 96 46 93 46 Z"/>
  </g>

  <!-- Inner hairline ring -->
  <circle cx="64" cy="64" r="38.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Bottom telemetry bar beneath medallion -->
  <line x1="42" y1="117" x2="86" y2="117" stroke="#F5E8D0" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
</svg>

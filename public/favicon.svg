<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SMM UP</title>
  
  <!-- Pure Obsidian Pitch-Black Squircle Canvas -->
  <rect width="128" height="128" rx="20" fill="#000000"/>
  
  <!-- Precision Inner White Border (ExamCodes Signature) -->
  <rect x="4" y="4" width="120" height="120" rx="16" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  
  <defs>
    <!-- Crisp High-Contrast Glow -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- High-Impact Iconic 'UP' Monogram with Supersonic Arrow Node -->
  <g fill="#FFFFFF" filter="url(#coreGlow)">
    <!-- Bold 'U' Channel -->
    <path d="M 28 36 L 40 36 L 40 64 C 40 68 43 71 47 71 C 51 71 54 68 54 64 L 54 36 L 66 36 L 66 65 C 66 76 58 83 47 83 C 36 83 28 76 28 65 Z"/>
    
    <!-- Bold 'P' Pillar & Loop -->
    <path d="M 74 36 L 94 36 C 103 36 109 41 109 49 C 109 57 103 62 94 62 L 86 62 L 86 83 L 74 83 Z M 86 46 L 86 52 L 93 52 C 96 52 98 51 98 49 C 98 47 96 46 93 46 Z"/>
    
    <!-- Apex Chevron Arrow Beacon (Points UP) -->
    <polygon points="47,20 54,28 40,28"/>
  </g>

  <!-- Live Pulse Core Node -->
  <circle cx="86" cy="49" r="2.5" fill="#000000"/>

  <!-- Signature Bottom Telemetry Frequency Lines (ExamCodes & thatonearyan-sh) -->
  <line x1="30" y1="102" x2="98" y2="102" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="42" y1="110" x2="86" y2="110" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4" stroke-linecap="round"/>
</svg>

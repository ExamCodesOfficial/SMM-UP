<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="SMM UP Logo">
  <title>SMM UP — Institutional Growth Engine</title>
  
  <!-- Warm Obsidian Matte Squircle Canvas -->
  <rect width="128" height="128" rx="28" fill="#090807"/>
  
  <!-- Subtle Internal Architectural Contour -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="rgba(255,245,230,0.12)" stroke-width="1.5"/>
  
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="champagneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5E8D0"/>
      <stop offset="100%" stop-color="#E2D4B7"/>
    </linearGradient>
  </defs>

  <!-- Precision Cyber 'UP' Architectural Monogram -->
  <g fill="url(#champagneGrad)" filter="url(#glow)">
    <!-- 'U' Channel: Left stem, bottom bridge, right stem -->
    <path d="M 28 36 L 28 66 C 28 77 37 84 48 84 C 59 84 68 77 68 66 L 68 36 L 56 36 L 56 65 C 56 70 52 73 48 73 C 44 73 40 70 40 65 L 40 36 Z"/>
    
    <!-- 'P' Supersonic Pillar & Upper Loop -->
    <!-- Ascending Pillar -->
    <rect x="74" y="36" width="11" height="48" rx="2"/>
    <!-- Outer Loop with Arrowhead Apex -->
    <path d="M 85 36 L 98 36 C 105 36 110 40 110 48 C 110 56 105 60 98 60 L 85 60 Z M 95 46 L 95 50 C 97 50 99 49 99 48 C 99 47 97 46 95 46 Z" fill-rule="evenodd"/>
    
    <!-- Dynamic Upward Growth Apex Beacon -->
    <polygon points="79.5,24 85,32 74,32"/>
  </g>

  <!-- Live Pulse Sensor Node -->
  <circle cx="85" cy="48" r="3" fill="#FFFFFF"/>
  <circle cx="85" cy="48" r="1.5" fill="#090807"/>

  <!-- Bottom Telemetry Frequency Lines (ExamCodes & thatonearyan-sh signature) -->
  <line x1="32" y1="102" x2="96" y2="102" stroke="#FAF7F2" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <line x1="42" y1="108" x2="86" y2="108" stroke="#FAF7F2" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
